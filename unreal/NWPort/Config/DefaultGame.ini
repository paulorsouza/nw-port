[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=NWPort
ProjectDisplayedTitle=INVTEXT("New World: Exiles")

[/Script/UnrealEd.ProjectPackagingSettings]
; Carregados por caminho no C++ (TSoftObjectPtr/LoadObject), sem referência de mapa: o cook precisa incluir.
+DirectoriesToAlwaysCook=(Path="/Game/NW/Gatherables")
+DirectoriesToAlwaysCook=(Path="/Game/NW/sword_shield")
+DirectoriesToAlwaysCook=(Path="/Game/NW/Data")
+DirectoriesToAlwaysCook=(Path="/Game/NW/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/NW/boar")
+DirectoriesToAlwaysCook=(Path="/Game/NW/wolf")
+DirectoriesToAlwaysCook=(Path="/Game/NW/Creatures")

[/Script/Engine.GameNetworkManager]
; Movimento (docs/tech/architecture.md): o cliente continua andando a cada quadro na tela dele, mas junta os quadros e
; manda ao servidor no máximo 30 movimentos/s (15/s parado); o servidor processa metade ou menos do que antes.
ClientNetSendMoveDeltaTime=0.0333
ClientNetSendMoveDeltaTimeThrottled=0.0333
ClientNetSendMoveDeltaTimeStationary=0.0666
; Anti-trapaça: cliente que manda movimentos com o tempo acelerado (speed hack) é detectado e corrigido.
bMovementTimeDiscrepancyDetection=true
bMovementTimeDiscrepancyResolution=true
