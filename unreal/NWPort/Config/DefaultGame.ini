[/Script/Engine.GameNetworkManager]
; Movement (docs/tech/architecture.md): the client still moves every frame on its own screen, but batches the frames and
; sends the server at most 30 moves/s (15/s when idle); the server processes half or less of what it did before.
ClientNetSendMoveDeltaTime=0.0333
ClientNetSendMoveDeltaTimeThrottled=0.0333
ClientNetSendMoveDeltaTimeStationary=0.0666
; Anti-cheat: a client that sends moves with sped-up time (speed hack) is detected and corrected.
bMovementTimeDiscrepancyDetection=true
bMovementTimeDiscrepancyResolution=true
