# Full clan server: Postgres + nw-core + game server.
#   ./build_images.sh && docker compose up -d      (secrets in .env: NW_SERVER_SECRET, NW_DB_PASSWORD)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nw
      POSTGRES_PASSWORD: ${NW_DB_PASSWORD:?set NW_DB_PASSWORD}
      POSTGRES_DB: nw
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped
  core:
    image: nw-core:local
    environment:
      DATABASE_URL: postgres://nw:${NW_DB_PASSWORD}@db:5432/nw
      NW_SERVER_SECRET: ${NW_SERVER_SECRET:?set NW_SERVER_SECRET}
      NW_BIND: 0.0.0.0:8090
    ports:
      - "8090:8090"
    depends_on: [db]
    restart: unless-stopped
  game:
    image: nw-gameserver:local
    environment:
      NW_SERVER_SECRET: ${NW_SERVER_SECRET}
    command: ["/Game/NW/Maps/L_SouthWindsward", "-log", "-port=7777", "-nwbackend=http://core:8090"]
    ports:
      - "7777:7777/udp"
    depends_on: [core]
    restart: unless-stopped
volumes:
  db:
